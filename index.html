<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A safe and secure login page for MyApp">
    <meta name="juli" content="juli sharma">
    <link rel="stylesheet" href="styles.css">
    <link data-default-icon="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png" rel="icon" sizes="192x192" href="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png">
    <title>Instagram</title>
</head>
<body>
    <div class="main-container">
        <div class="login-box">
            <img src="logo.png" class="logo" alt="Instagram">
            <h1>Login</h1>
            
            <button class="fb-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="FB">
                Continue with Facebook
            </button>

            <div class="separator">OR</div>

            <!-- Added form element and input IDs -->
            <form id="login-form">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="login-btn">Log in</button>
            </form>

            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

         <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>

        <div class="footer">
            By continuing, you agree to Instagram's<br>
            <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>
        </div>
    </div>
    

    <script src="app.js"></script>
</body>
</html>
